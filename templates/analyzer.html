<!DOCTYPE html>
<html lang="en">
<head>
    <title>Security Auditor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="container py-5">
    <div class="col-md-6 mx-auto">
        <div class="card p-4">
            <h2 class="text-center text-accent mb-4">🛡️ Cookie Auditor</h2>
            <form action="/analyze" method="POST">
                <div class="mb-3">
                    <label class="form-label">Target Website URL</label>
                    <input type="text" name="url" class="form-control bg-dark text-white border-secondary" placeholder="http://127.0.0.1:5001" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Run Audit</button>
            </form>
        </div>
    </div>
</body>
</html>
